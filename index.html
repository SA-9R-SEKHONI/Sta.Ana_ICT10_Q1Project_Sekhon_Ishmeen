<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project |SKU Generator</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js">
    </script>


    <style>


        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Jost', sans-serif;

            color: #3f3040;


            background-image:
                linear-gradient(
                    rgba(255, 209, 220, 0.30),
                    rgba(255, 209, 220, 0.30)
                ),
                url("bg.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .navbar {
            background: #ffffff !important;

            box-shadow:
                0 4px 18px rgba(184, 92, 131, 0.15);

            padding: 10px 0;
        }


        .navbar-brand {
            display: flex;
            align-items: center;
        }

        .brand-logo {
            height: 100px;
            width: auto;

            object-fit: contain;

            transition: 0.3s;
        }

        .brand-logo:hover {
            transform: scale(1.04);
        }


        .nav-link {
            color: #000000 !important;

            font-weight: 600;

            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #b85c83 !important;
        }

        .navbar-toggler {
            border-color: #f3bfd5 !important;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23b85c83' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2.5' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        .app-card {
            border: none;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.93);

            box-shadow:
                0 18px 45px rgba(195, 34, 123, 0.25);

            overflow: hidden;

            backdrop-filter: blur(8px);
        }


        .app-card .card-header {
            border-radius: 0;

            background: rgba(255, 209, 220, 0.35);

            color: #49384d;

            padding: 2.2rem;

            border: none;
        }


        .card-header i,
        .card-header span {
            color: #b8759a;

            margin-bottom: 12px;
        }


        .card-header h3 {
            font-family: 'Cormorant Garamond', serif;

            font-size: 2.4rem;

            font-weight: 600;

            letter-spacing: 1.5px;

            color: #49384d;
        }


        .card-header small {
            color: #6b4a5c;

            font-size: 0.9rem;
        }


        .form-label {
            font-weight: 600;

            color: #49384d;
        }


        .form-label i {
            color: #ad6085;
        }


        .form-control,
        .form-select {
            border: 2px solid #ead7e4;

            border-radius: 13px;

            padding: 12px 14px;

            background-color: rgba(255, 250, 253, 0.95);

            color: #4d3843;

            transition: 0.3s;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: #b8759a;

            box-shadow:
                0 0 0 0.2rem rgba(184, 117, 154, 0.15);

            background-color: white;
        }


        .form-control::placeholder {
            color: #aaa0aa;
        }

        .btn-generate {
            background: linear-gradient(
                135deg,
                #e36c9d,
                #dd5cb4
            );

            border: none;

            border-radius: 13px;

            font-weight: 600;

            letter-spacing: 0.5px;

            padding: 13px;

            box-shadow:
                0 7px 18px rgba(145, 81, 126, 0.25);

            transition: 0.3s;
        }


        .btn-generate:hover {
            transform: translateY(-2px);

            background: linear-gradient(
                135deg,
                #ed5e9c,
                #ea4aaf
            );

            color: white;
        }


        .btn-generate:active {
            transform: translateY(0);
        }


        #sku_output {
            min-height: 3rem;
        }


        .result-box {
            background-color: #fff3f7;

            border-left: 5px solid #b85c83;

            border-radius: 12px;

            padding: 1rem 1.25rem;
        }


        .sku-code {
            font-family: 'Courier New', monospace;

            font-weight: 700;

            font-size: 1.3rem;

            color: #974d73;

            letter-spacing: 1px;
        }


        hr {
            border-color: #ead7e4;

            opacity: 0.8;
        }


        footer {
            background: #ffffff !important;

            margin-top: 16px;

            padding: 8px 0 !important;

            box-shadow:
                0 -4px 18px rgba(184, 92, 131, 0.15);
        }


        footer p {
            color: #000000;

            font-size: 0.75rem;

            margin-bottom: 0px;
        }

        footer .container p:first-child {
            margin-bottom: 2px;
        }


        footer i,
        footer span {
            color: #b85c83;
        }

        py-terminal {
            display: none;
        }


        @media (max-width: 576px) {

            .brand-logo {
                height: 70px;
            }

            .card-header h3 {
                font-size: 1.7rem;
            }

            .app-card {
                border-radius: 18px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                <img
                    src="logo.png"
                    alt="Ives Logo"
                    class="brand-logo">

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navMenu">

                <ul class="navbar-nav ms-auto">



                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="index.html">

                            <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><rect x="2" y="4" width="2" height="16"/><rect x="6" y="4" width="1" height="16"/><rect x="9" y="4" width="3" height="16"/><rect x="14" y="4" width="1" height="16"/><rect x="17" y="4" width="2" height="16"/><rect x="21" y="4" width="1" height="16"/></svg></span>

                            SKU Generator

                        </a>

                    </li>



                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="receipt_generator.html">

                            <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><path d="M4 2h16v19l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V2z"/></svg></span>

                            Receipt Generator

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>




    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">


                <div class="card app-card">



                    <div class="card-header text-center">

                        <span style="display:inline-block;"><svg width="32" height="32" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><rect x="2" y="4" width="2" height="16"/><rect x="6" y="4" width="1" height="16"/><rect x="9" y="4" width="3" height="16"/><rect x="14" y="4" width="1" height="16"/><rect x="17" y="4" width="2" height="16"/><rect x="21" y="4" width="1" height="16"/></svg></span>

                        <h3 class="mb-1">
                            SKU Generator
                        </h3>

                        <small>
                            Indian × Filipino Accessories
                        </small>

                    </div>



                    <div class="card-body p-4">


                        <form id="sku-form">


                            <div class="mb-3">

                                <label
                                    for="category"
                                    class="form-label">

                                    <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><path d="M12.41 2H4a2 2 0 0 0-2 2v8.41a2 2 0 0 0 .59 1.41l9.59 9.59a2 2 0 0 0 2.82 0l7.59-7.59a2 2 0 0 0 0-2.82L13 2.59A2 2 0 0 0 12.41 2zM7 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></span>

                                    Category

                                </label>


                                <select
                                    id="category"
                                    class="form-select">

                                    <option value="Earrings">
                                        Earrings
                                    </option>

                                    <option value="Necklaces">
                                        Necklaces
                                    </option>

                                    <option value="Bracelets & Bangles">
                                        Bracelets & Bangles
                                    </option>

                                    <option value="Rings">
                                        Rings
                                    </option>

                                    <option value="Anklets">
                                        Anklets
                                    </option>

                                    <option value="Hair Accessories">
                                        Hair Accessories
                                    </option>

                                    <option value="Purses">
                                        Purses
                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="product_name"
                                    class="form-label">

                                    <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#b85c83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></span>

                                    Product Name

                                </label>


                                <input
                                    type="text"
                                    id="product_name"
                                    class="form-control"
                                    placeholder="e.g. Pearl Earrings">

                            </div>


                            <div class="mb-4">

                                <label
                                    for="quantity"
                                    class="form-label">

                                    <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></span>

                                    Stock Quantity

                                </label>


                                <input
                                    type="number"
                                    id="quantity"
                                    class="form-control"
                                    placeholder="e.g. 50"
                                    min="0">

                            </div>



                            <div class="d-grid">

                                <input
                                    type="button"
                                    py-click="SKU_generator"
                                    value="Generate SKU"
                                    class="btn btn-generate btn-lg text-white">

                            </div>


                        </form>


                        <hr class="my-4">



                        <div id="sku_output"></div>


                    </div>

                </div>

            </div>

        </div>

    </div>



    <footer class="text-center py-4">

        <div class="container">

            <p class="mb-1">

                <span class="me-1"><svg style="vertical-align:-3px;" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#b85c83"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg></span>

                Ives — Indian × Filipino Accessories

            </p>


            <p class="mb-0">

                1st Quarter Project

            </p>

        </div>

    </footer>


    <py-script src="main.py"></py-script>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
